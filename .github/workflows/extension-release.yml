name: Extension release

# #54 (decisions 0014, 0020): a release of the Chrome extension, from a tag `extension-v<version>`
# that matches apps/extension/package.json. It builds, checks the manifest, and attaches the zip
# to a GitHub release. Uploading to the Chrome Web Store is added with the store listing; its
# credentials will live only in this workflow's GitHub environment, never in the repo.

on:
  push:
    tags: ['extension-v*']

permissions:
  contents: read

jobs:
  release:
    name: Release extension
    runs-on: ubuntu-24.04
    permissions:
      # Creating the GitHub release and attaching the zip.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./apps/extension/package.json').version")
          if [ "$TAG" != "extension-v$version" ]; then
            echo "Tag $TAG does not match apps/extension/package.json version $version" >&2
            exit 1
          fi
      - name: Build (Chrome, Manifest V3)
        run: pnpm --filter @jobdeputy/extension build
      - name: The built manifest asks only for what src/manifest.ts lists
        run: node --experimental-strip-types scripts/check-extension-manifest.mjs
      - name: Zip
        run: pnpm --filter @jobdeputy/extension zip
      - name: GitHub release with the zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" apps/extension/.output/*-chrome.zip --title "$TAG" --notes "Chrome extension $TAG."
