name: Extension release

# #54 (decisions 0014, 0020): a release of the Chrome extension, from a tag `extension-v<version>`
# that matches apps/extension/package.json and is on main. One job builds with a read-only token
# (dependencies install there); a second job, which installs nothing, attaches the zip to a GitHub
# release. Uploading to the Chrome Web Store is added with the store listing; its credentials will
# live only in that job's GitHub environment, never in the repo.

on:
  push:
    tags: ['extension-v*']

permissions:
  contents: read

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tagged commit is on main (reviewed, and tested there)
        # fetch-depth 0 already brings origin/main (no second fetch: it would have no token).
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./apps/extension/package.json').version")
          if [ "$TAG" != "extension-v$version" ]; then
            echo "Tag $TAG does not match apps/extension/package.json version $version" >&2
            exit 1
          fi
      - name: Typecheck and unit tests (least privilege included)
        run: |
          pnpm --filter @jobdeputy/extension typecheck
          pnpm --filter @jobdeputy/extension test
      - name: Build and zip (Chrome, Manifest V3)
        run: pnpm --filter @jobdeputy/extension zip
      - name: The built manifest asks only for what src/manifest.ts lists
        run: node --experimental-strip-types scripts/check-extension-manifest.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-release
          path: apps/extension/.output/*-chrome.zip
          retention-days: 7

  release:
    name: Release extension
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      # Only this job, which installs and runs nothing from the repo, may create the release.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-release
      - name: GitHub release with the zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" ./*-chrome.zip --repo "$REPO" --title "$TAG" --notes "Chrome extension $TAG."
