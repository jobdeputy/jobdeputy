name: Web

# #14: browser tests for the web app on seven devices (decision 0012), and screenshot proof
# posted on every PR that changes it. Runs only when the web app or its dependencies change.

on:
  pull_request:
    paths:
      - apps/web/**
      - pnpm-lock.yaml
      - .github/workflows/web.yml
      - scripts/publish-ui-screenshots.sh
  push:
    branches: [main]
    paths:
      - apps/web/**
      - pnpm-lock.yaml
      - .github/workflows/web.yml
      - scripts/publish-ui-screenshots.sh

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @jobdeputy/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browsers and their system libraries
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @jobdeputy/web exec playwright install --with-deps chromium firefox webkit
      - name: Install the browsers' system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @jobdeputy/web exec playwright install-deps chromium firefox webkit
      - name: Playwright on every device (desktop, tablet, phones)
        run: pnpm --filter @jobdeputy/web test:e2e
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
      - name: Keep the screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: apps/web/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  screenshots:
    name: Post screenshots
    needs: browser-tests
    # Same-repo PRs only: a fork's token cannot write, and fork code never gets a write token.
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # the ui-screenshots branch only
      pull-requests: write # the screenshot comment
    concurrency:
      # The branch is rewritten on each run; one writer at a time.
      group: ui-screenshots
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-screenshots
          path: screenshots
      - name: Post them on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-ui-screenshots.sh "${{ github.event.pull_request.number }}" "${{ github.event.pull_request.head.sha }}" screenshots
