name: Deploy dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS, no stored keys

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy dev-iad
    runs-on: ubuntu-24.04
    environment: dev # only main may deploy (environment branch policy)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy dev cells
        working-directory: infra
        env:
          JD_ACCOUNT_DEV_IAD: ${{ secrets.JD_ACCOUNT_DEV_IAD }}
          JD_ALERT_EMAIL: ${{ secrets.JD_ALERT_EMAIL }}
        run: pnpm cdk deploy --all -c stage=dev --require-approval never
      - name: Integration tests against dev-iad
        env:
          JD_STACK: jobdeputy-dev-iad
          JD_FULL: '1'
          AWS_REGION: us-east-1
        run: pnpm test:integration
