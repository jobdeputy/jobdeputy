name: Update screenshot baselines

# #14: makes the visual baselines (apps/web/e2e/visual.spec.ts) on Linux, as CI checks them, and
# pushes them to a new branch for a pull request; main is protected, so nothing lands without
# review. Run it by hand (Actions → Update screenshot baselines → Run workflow) on the branch whose
# screens are approved.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshot-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baselines:
    name: Make the baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # repo-wide by GitHub design; the job pushes only its own new branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @jobdeputy/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # Restore only: this job installs two of the three browsers, so it must never save the cache
      # the Web workflow fills with all three.
      - name: Restore the browsers
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browsers and their system libraries
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @jobdeputy/web exec playwright install --with-deps chromium webkit
      - name: Install the browsers' system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @jobdeputy/web exec playwright install-deps chromium webkit
      - name: Make the baselines (desktop, tablet, phone)
        run: >-
          pnpm --filter @jobdeputy/web exec playwright test visual
          --project=desktop-chrome --project=ipad --project=iphone --update-snapshots=all
      - name: Push them to a new branch
        env:
          FROM: ${{ github.ref_name }}
          BRANCH: chore/screenshot-baselines-${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$(git status --porcelain -- apps/web/e2e/__screenshots__)" ]; then
            echo "The baselines are unchanged; nothing to push." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add apps/web/e2e/__screenshots__
          git commit -q -m "Screenshot baselines from $FROM (run ${{ github.run_number }})"
          git push -q origin "$BRANCH"
          {
            echo "New baselines are on \`$BRANCH\`. Look at them, then open a pull request:"
            echo "https://github.com/$REPO/compare/$FROM...$BRANCH?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
