name: Update screenshot baselines

# #14: makes the visual baselines (apps/web/e2e/visual.spec.ts) on Linux, as CI checks them, and
# pushes them to a new branch for a pull request into the branch it ran on; nothing lands without
# review. Run it by hand (Actions → Update screenshot baselines → Run workflow) on the branch whose
# screens are approved: a look-change PR's own branch, so its checks pass before it merges.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshot-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Makes them with no write access: this job installs and runs the app's dependencies, so it
  # keeps no credentials (persist-credentials: false) and hands the PNGs on as an artifact.
  make:
    name: Make the baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @jobdeputy/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # Restore only: this job installs two of the three browsers, so it must never save the cache
      # the Web workflow fills with all three.
      - name: Restore the browsers
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browsers and their system libraries
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @jobdeputy/web exec playwright install --with-deps chromium webkit
      - name: Install the browsers' system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @jobdeputy/web exec playwright install-deps chromium webkit
      # Only the baselines that are missing or no longer match are written, so an unchanged screen
      # keeps its PNG byte for byte.
      - name: Make the baselines (desktop, tablet, phone)
        run: >-
          pnpm --filter @jobdeputy/web exec playwright test visual
          --project=desktop-chrome --project=ipad --project=iphone --update-snapshots=changed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-baselines
          path: apps/web/e2e/__screenshots__/
          if-no-files-found: error
          retention-days: 7
          overwrite: true # a re-run replaces the earlier attempt's

  # Pushes them: write access, but it never installs or runs dependency code.
  push:
    name: Push them to a new branch
    needs: make
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # repo-wide by GitHub design; the job pushes only its own new branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshot-baselines
          path: ${{ runner.temp }}/baselines
      # The artifact comes from a job that ran dependency code: only plain files named
      # <screen>--<device>.png that really are PNGs go in, and they replace the whole set (so a
      # baseline the make job dropped is dropped here too).
      - name: Take in only PNG baselines
        env:
          INCOMING: ${{ runner.temp }}/baselines
        run: |
          shopt -s nullglob dotglob
          files=("$INCOMING"/*)
          if [ "${#files[@]}" -eq 0 ]; then echo "No baselines came in."; exit 1; fi
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            if [ -L "$file" ] || [ ! -f "$file" ] || ! [[ "$name" =~ ^[a-z0-9-]+--[a-z0-9-]+\.png$ ]]; then
              echo "Refusing $name: not a <screen>--<device>.png file."; exit 1
            fi
            if [ "$(head -c 8 "$file" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]; then
              echo "Refusing $name: not a PNG."; exit 1
            fi
          done
          rm -rf apps/web/e2e/__screenshots__
          mkdir -p apps/web/e2e/__screenshots__
          cp "${files[@]}" apps/web/e2e/__screenshots__/
      - name: Push them to a new branch
        env:
          FROM: ${{ github.ref_name }}
          BRANCH: chore/screenshot-baselines-${{ github.run_number }}-${{ github.run_attempt }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
        run: |
          if [ -z "$(git status --porcelain -- apps/web/e2e/__screenshots__)" ]; then
            echo "The baselines are unchanged; nothing to push." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -A apps/web/e2e/__screenshots__
          git commit -q -m "Screenshot baselines from $FROM (run $RUN)"
          git push -q origin "$BRANCH"
          {
            echo "New baselines are on \`$BRANCH\`. Look at them, then open a pull request into \`$FROM\`:"
            echo "https://github.com/$REPO/compare/$FROM...$BRANCH?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
