name: Extension

# #54 (decisions 0014, 0020): builds the Chrome extension and checks that what ships asks only for
# what src/manifest.ts lists. Runs only when the extension or what it builds from changes. Its
# lint, typecheck and unit tests run with everything else in CI's `pnpm test`.

on:
  pull_request:
    paths:
      - apps/extension/**
      - packages/shared/**
      - apps/web/src/styles/tokens.css
      - scripts/check-extension-manifest.mjs
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .nvmrc
      - tsconfig.base.json
      - .github/workflows/extension.yml
  push:
    branches: [main]
    paths:
      - apps/extension/**
      - packages/shared/**
      - apps/web/src/styles/tokens.css
      - scripts/check-extension-manifest.mjs
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .nvmrc
      - tsconfig.base.json
      - .github/workflows/extension.yml

permissions:
  contents: read

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One build, checked, tested and zipped: `wxt zip` builds, then everything uses that build.
      - name: Build and zip (Chrome, Manifest V3)
        run: pnpm --filter @jobdeputy/extension zip
      - name: The built manifest asks only for what src/manifest.ts lists
        run: node --experimental-strip-types scripts/check-extension-manifest.mjs
      - name: Chromium for the browser tests
        run: pnpm --filter @jobdeputy/extension exec playwright install --with-deps chromium
      - name: Browser tests (the built extension in Chromium), with the popup's screenshot
        run: pnpm --filter @jobdeputy/extension exec playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-chrome
          path: apps/extension/.output/*-chrome.zip
          retention-days: 14
      - name: Screenshots (the PR's proof for the extension's screens)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-screenshots
          path: apps/extension/screenshots/
          retention-days: 14
          if-no-files-found: ignore
