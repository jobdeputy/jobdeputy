name: Integration

# T11: every PR deploys its own stack from its code, runs the full integration
# suite, and deletes the stack. Required check, so a PR cannot merge if any
# feature (new or old) is broken. See docs/testing.md.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: read # reuse the previous commit's result for Markdown-only pushes
  id-token: write # GitHub OIDC -> AWS, no stored keys

concurrency:
  # One run per PR. Never cancel: stopping mid-deploy leaves a stack stuck.
  group: integration-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  integration:
    name: Integration
    runs-on: ubuntu-24.04
    environment: pr
    timeout-minutes: 45
    env:
      STACK: jobdeputy-dev-pr${{ github.event.pull_request.number }}-iad
      OWNER: pr${{ github.event.pull_request.number }}
      AWS_REGION: us-east-1
    steps:
      - name: Refuse PRs from forks
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::PRs from forks get no AWS access. A maintainer can push this branch to jobdeputy/jobdeputy after review to run the integration tests."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether to deploy
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.action == 'synchronize' && github.event.before || '' }}
        run: |
          # True only if every file changed between two commits is Markdown.
          # Fails safe: a missing commit or an empty diff counts as "not only Markdown".
          only_markdown() {
            local files
            files=$(git diff --name-only "$1" "$2") || return 1
            [ -n "$files" ] || return 1
            ! grep -qvE '\.md$' <<< "$files"
          }

          # 1. Nothing but Markdown in the whole PR: nothing to test.
          if only_markdown "$BASE" "$HEAD_SHA"; then
            echo "Only Markdown changed in this PR: no deploy needed."
            echo "code=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # 2. Only Markdown since the last push, and that commit already passed:
          #    the code is identical to what was tested, so reuse the result.
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             && only_markdown "$BEFORE" "$HEAD_SHA"; then
            previous=$(gh api "repos/$REPO/commits/$BEFORE/check-runs?check_name=Integration" \
              --jq '[.check_runs[] | select(.status == "completed")] | sort_by(.completed_at) | last | .conclusion // ""')
            if [ "$previous" = "success" ]; then
              echo "Only Markdown changed since ${BEFORE:0:7}, which passed Integration: reusing that result."
              echo "code=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "Previous commit's Integration result was '${previous:-none}': running in full."
          fi

          echo "code=true" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.code == 'true'
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.changes.outputs.code == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy the PR stack
        if: steps.changes.outputs.code == 'true'
        working-directory: infra
        env:
          JD_ACCOUNT_DEV_IAD: ${{ secrets.JD_ACCOUNT_DEV_IAD }}
        run: |
          exec_role="arn:aws:iam::${JD_ACCOUNT_DEV_IAD}:role/cdk-hnb659fds-cfn-exec-role-${JD_ACCOUNT_DEV_IAD}-us-east-1"
          pnpm cdk deploy "$STACK" -c stage=dev -c owner="$OWNER" -c cliCredentials=true \
            --role-arn "$exec_role" --require-approval never

      - name: Integration tests (full suite)
        if: steps.changes.outputs.code == 'true'
        env:
          JD_STACK: ${{ env.STACK }}
          JD_FULL: '1'
        run: pnpm test:integration

      - name: Delete the PR stack
        if: always() && steps.changes.outputs.code == 'true'
        run: |
          aws cloudformation delete-stack --stack-name "$STACK"
          aws cloudformation wait stack-delete-complete --stack-name "$STACK"
